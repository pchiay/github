<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game!</title>

    <!--Normalize-->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@100..900&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@100..900&family=McLaren&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=McLaren&display=swap" rel="stylesheet">

    <!--Styles-->
    <link href="styles.css" rel="stylesheet">

</head>
<body>

    <main class="loading-screen">

        <header class="gamename">
            <p class="first-heading">lucky <img src="images/clover.png" alt="clover" width="115" height="112"></p>
            <h1 class="second-heading">CHARM!</h1>
        </header>

        <section class="rules">
            <p>
                Roll two dice to earn points, first player to <strong>thirty wins</strong>.
            </p>
            <p>
                If the current player <strong>rolls a "one"</strong>, switch to the next player’s turn.
            </p>
            <p>
                Players can also <strong>pass their turn</strong>.
            </p>
        </section>


        <section class="play-button">
            <button class="play-btn">play!</button>
        </section>
    </main>
</body>
</html>
