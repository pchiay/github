<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 2</title>
</head>
<body>

    <h1>Experiment 2</h1>

    <script>
        /* Asks user to guess the color I'm thinking of and displays if they got it right or wrong.*/
        /* It will change the background of the body to that color if it was right! */

        var yourColor = prompt('Guess the color on my mind. Choose one (red, yellow, green, or blue)', '');
        var colorArray = ['red', 'yellow', 'green', 'blue'];

        function pickAColor(color){
            var randomPick = Math.floor(Math.random() * color.length);
            var chosenColor = color[randomPick];

            return chosenColor;
        }

        function verifyResult(userInput, generatedColor){
            if(userInput === generatedColor){
            alert(`You are right!`);
            document.querySelector('body').style.backgroundColor = userInput;
            } else{
                alert(`Try again! I was thinking of ${generatedColor}`);
            }
        }

        var colorSelected = pickAColor(colorArray);
        verifyResult(yourColor, colorSelected);

    </script>
</body>
</html>
