<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 1</title>
</head>
<body>
    <h1>Experiment 1</h1>
    <h2>Open console to see code</h2>

    <script>
        // loops through values 0 to 100 and prints Fizz if value is divisible by  and prints Buzz if value is divisible by five

        for(var i=0; i<=100; i++){ //loop

            //selection
            if(i % 3 ===0){ // checks if value is divisible by 3
                console.log('Fizz'); 
            }
            
            //selection
            else if(i % 5 === 0){ //checks if value is divisible by 5
                console.log('Buzz');
            }
            
            else{ //if neither value i is divisible by 3 or 5 then print the value of i
                console.log(i);
            }
        }
    </script> 


    
</body>
</html>
